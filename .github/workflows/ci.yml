name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables. No domain is stored in this file.
  # SITE_URL: the *.vercel.app URL until a domain is bought, then the real origin.
  # PUBLIC_HOSTING_COMMERCIAL: leave unset or "false" on Vercel Hobby (no ads, no affiliate links).
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_HOSTING_COMMERCIAL: ${{ vars.PUBLIC_HOSTING_COMMERCIAL || 'false' }}

jobs:
  quality:
    name: Lint, types, build, SEO gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require SITE_URL
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable. Until a domain is bought, use the *.vercel.app URL."
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check

      - name: Build (astro + pagefind)
        run: pnpm build

      # Pull requests: structural checks fail; unfinished articles only warn.
      - name: SEO check
        if: github.event_name == 'pull_request'
        run: pnpm seo-check

      # main: production gate. Unfinished articles, short pages and drafts fail.
      - name: SEO check (strict)
        if: github.ref == 'refs/heads/main'
        run: pnpm seo-check:strict

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI (fail < 90 perf, < 95 SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
