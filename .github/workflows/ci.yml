name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables. No domain is stored in this file.
  # SITE_URL: the *.vercel.app URL until a domain is bought, then the real origin.
  # PUBLIC_HOSTING_COMMERCIAL: leave unset or "false" on Vercel Hobby (no ads, no affiliate links).
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_HOSTING_COMMERCIAL: ${{ vars.PUBLIC_HOSTING_COMMERCIAL || 'false' }}

jobs:
  quality:
    name: Lint, types, build, SEO check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI-only fallback. https://ci.screenwise.invalid can never resolve, and
      # scripts/lib/env.ts refuses it outside CI (on Vercel, or without SCREENWISE_CI_FALLBACK=1).
      # launch-check fails on it, so it can never reach a production build.
      - name: SITE_URL fallback for CI
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL repository variable is empty. Using the CI-only fallback https://ci.screenwise.invalid."
            echo "SITE_URL=https://ci.screenwise.invalid" >> "$GITHUB_ENV"
            echo "SCREENWISE_CI_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check

      - name: Build (astro + pagefind)
        run: pnpm build

      # Every branch: structural SEO checks fail; content-readiness issues only warn.
      # The strict gate and launch-check run only in `pnpm build:prod`.
      - name: SEO check
        run: pnpm seo-check

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (non-blocking)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
